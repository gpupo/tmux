#  tmux.conf — Configuração pessoal de @gpupo
#  Repositório: https://github.com/gpupo/tmux
#  Licença: MIT
# =============================================================================
#
#  FILOSOFIA DESTA CONFIGURAÇÃO
#  ─────────────────────────────
#  • Fluxo de trabalho centrado em teclado, inspirado no Vim.
#  • Dois "modos" customizados além do prefix padrão:
#      C-s  →  modo SESSIONS  (navegação e gerenciamento de sessões)
#      C-g  →  modo TOOLS     (ferramentas externas em janelas dedicadas)
#  • Visual com o tema TokyoNight Night — escuro, limpo, informativo.
#  • Plugins mínimos via TPM (Tmux Plugin Manager).
#
#  REQUISITOS
#  ──────────
#  • tmux ≥ 3.4
#  • TPM  → https://github.com/tmux-plugins/tpm
#  • tms  → https://github.com/jrmoulton/tmux-sessionizer  (opcional)
#  • Scripts auxiliares em bin/ (incluídos neste repositório)
#  • lazygit, lazydocker, nvim, yazi  (para o modo TOOLS)
#
#  INSTALAÇÃO RÁPIDA
#  ─────────────────
#  1. Clone este repositório e rode `scripts/setup.sh`
#  2. Abra o tmux e pressione <prefix> + I  para instalar os plugins (TPM)
#  3. Recarregue com <prefix> + r
#
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
#  SEÇÃO 1 — TERMINAL
#  Garante suporte a cores verdadeiras (24-bit / TrueColor), teclas estendidas
#  e repasse de eventos de foco para editores como Neovim.
# ─────────────────────────────────────────────────────────────────────────────

# Informa ao tmux que o terminal interno deve anunciar suporte a 256 cores
# e ao protocolo tmux nativo (melhor que "screen-256color").
set -g default-terminal "tmux-256color"

# Ativa teclas estendidas (Ctrl+Shift+Letra, etc.) via sequência CSI-u.
# Necessário para keymaps avançados no Neovim e outros editores TUI.
set -as terminal-features 'xterm*:extkeys'
set -g extended-keys on
set -g extended-keys-format csi-u

# Sobrescreve a variável TERM do terminal host para habilitar RGB (TrueColor).
# O "*" cobre qualquer emulador (iTerm2, Kitty, WezTerm, Alacritty…).
set -gs terminal-overrides ",*:RGB"

# Habilita hiperlinks clicáveis OSC 8 (suportado pelo tmux a partir da v3.4).
# Permite que saídas de ferramentas como `delta` ou `glow` gerem links reais.
set -ga terminal-features "*:hyperlinks"

# Repassa eventos de foco (FocusIn/FocusOut) para os programas dentro do painel.
# Indispensável para o autoread do Neovim funcionar ao trocar de janela/painel.
set-option -g focus-events on

# Permite que aplicativos dentro do tmux leiam/escrevam na área de transferência
# do sistema via OSC 52, e possibilita passagem de sequências de escape (OSC, DCS)
# para o terminal host — necessário para, por exemplo, imagens inline (Kitty, iTerm2).
set -g set-clipboard on
set -g allow-passthrough on


# ─────────────────────────────────────────────────────────────────────────────
#  SEÇÃO 2 — COMPORTAMENTO GERAL
# ─────────────────────────────────────────────────────────────────────────────

# Recarrega este arquivo sem reiniciar o tmux.
# Útil durante ajustes — <prefix> + r
bind r source-file ~/.tmux.conf \; display "✔ tmux.conf recarregado"

# Janelas e painéis começam em 1 (mais intuitivo no teclado do que começar em 0).
set -g base-index 1
set -g pane-base-index 1

# Renumera as janelas automaticamente ao fechar uma delas.
# Evita lacunas na numeração (ex.: 1, 3, 5 → vira 1, 2, 3).
set -g renumber-windows on

# Aumenta o histórico de rolagem para 150 000 linhas.
# Importante para logs longos, compilações, saída de testes, etc.
set -g history-limit 150000

# Mantém as mensagens de status visíveis por 2 segundos (padrão é 750 ms).
set -g display-time 2000

# Habilita alertas visuais quando há atividade em janelas em segundo plano.
setw -g monitor-activity on
set -g visual-activity on

# Habilita o mouse: clique para selecionar painel/janela, scroll, redimensionar.
# Dica: segure Shift ao clicar para contornar o tmux e selecionar texto no terminal.
set -g mouse on


# ─────────────────────────────────────────────────────────────────────────────
#  SEÇÃO 3 — MODO VI / COPIAR E COLAR
#  O tmux tem um "modo de cópia" (copy-mode) acionado com <prefix> + [
#  Esta seção o configura para funcionar como o Vim/Neovim.
# ─────────────────────────────────────────────────────────────────────────────

# Usa teclas no estilo vi dentro do modo de cópia e na linha de comando.
set-window-option -g mode-keys vi

# v  → inicia seleção (como o visual mode do Vim)
bind -T copy-mode-vi v send-keys -X begin-selection

# y  → copia seleção E sai do modo de cópia.
#      Tenta pbcopy (macOS) primeiro; cai para xclip (Linux) se não disponível.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
  'pbcopy || xclip -in -selection clipboard'

# Option+Shift+V  →  carrega o clipboard do macOS no buffer interno do tmux.
# Útil para colar texto de fora do tmux em sessões remotas via SSH.
bind -n M-V { refresh-client -l; run -d0.1; \
  run-shell "/usr/bin/pbpaste | tmux load-buffer -" }

# Shift+PgUp  →  entra no modo de cópia rolando uma página acima.
# Atalho conveniente para inspecionar saídas longas sem o prefix.
bind -T root -n S-PPage copy-mode -u

# Ctrl+Scroll e Alt+Scroll funcionam melhor com paginadores (man, less, more).
# Envia teclas Up/Down para o programa em vez de rolar o buffer do tmux.
# Referência: https://github.com/tmux/tmux/wiki/Recipes#send-up-and-down-keys-for-the-mouse-wheel
bind -n M-WheelUpPane   if -Ft= "#{mouse_any_flag}" "send -M" "send Up Up Up"
bind -n M-WheelDownPane if -Ft= "#{mouse_any_flag}" "send -M" "send Down Down Down"


# ─────────────────────────────────────────────────────────────────────────────
#  SEÇÃO 4 — NAVEGAÇÃO ESTILO VIM
#  Permite mover entre painéis e janelas sem tirar as mãos da posição home.
# ─────────────────────────────────────────────────────────────────────────────

# <prefix> + h/j/k/l  →  move entre painéis (esquerda/baixo/cima/direita)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# <prefix> + ^  →  volta para a última janela ativa (alterna entre duas janelas)
bind -r ^ last-window

# Ctrl+h / Ctrl+l  →  janela anterior / próxima janela  (sem prefix!)
bind -n C-h previous-window
bind -n C-l next-window

# Ctrl+j / Ctrl+k  →  próxima sessão / sessão anterior  (sem prefix!)
bind -n C-j switch-client -n
bind -n C-k switch-client -p

# <prefix> + ,  →  abre o tmux.conf no Neovim dentro de um popup
bind , display-popup -E -w 90% -h 90% "nvim $HOME/.config/tmux/tmux.conf"

# <prefix> + Enter  →  popup rápido (shell genérico 90%×40%)
bind -T prefix Enter display-popup -E -w 90% -h 40%



# ─────────────────────────────────────────────────────────────────────────────
#  SEÇÃO 5 — MODO SESSIONS  (C-s)
#  ─────────────────────────────────────────────────────────────────────────────
#  Pressione C-s para entrar no modo SESSION-KEY-TABLE.
#  Uma mensagem "SESSIONS" aparece na barra de status.
#  Em seguida, pressione uma das teclas abaixo:
#
#   f  →  fuzzy-find/criar sessões via `tms` (tmux-sessionizer)
#   l  →  árvore visual de sessões/janelas (choose-tree)
#   d  →  sessionize para ~/.dotfiles/
#   k  →  matar sessão atual (com confirmação)
#   r  →  renomear janela atual
#   R  →  renomear sessão atual
#   a  →  preset "dev"
#   b  →  preset "ops"
#   A  →  preset "ai"
#   e  →  preset "explore"
#  Enter →  popup persistente com ~/work/ (toggle)
#   C-s  →  fallback — envia C-s ao programa (ex.: salvar no Vim)
# ─────────────────────────────────────────────────────────────────────────────

# Entra no modo sessions e exibe label na status bar
bind -n C-s display-message "SESSIONS" \; switch-client -T session-key-table

# Fallback: se pressionar C-s novamente, envia o sinal para o programa ativo
bind -T session-key-table C-s send-keys C-s

# Fuzzy finder de sessões — tenta tms primeiro, cai para o sessionize deste repo
bind -T session-key-table f \
  display-popup -E -w 80% -h 80% "tms 2>/dev/null || $HOME/.config/tmux/bin/sessionize"

# Exibe árvore interativa de todas as sessões e janelas (-Z = zoom)
bind -T session-key-table l choose-tree -Zs

# Abre ~/.dotfiles/ como nova sessão
bind -T session-key-table d \
  run-shell "tmux neww $HOME/.config/tmux/bin/sessionize ~/.dotfiles/"

# Mata a sessão atual com elegância (script com confirmação)
bind -T session-key-table k \
  run-shell "$HOME/.config/tmux/bin/kill-session"

# Renomeia a janela atual via prompt inline
bind -T session-key-table r \
  command-prompt -p "Rename window:" "rename-window '%%'"

# Renomeia a sessão atual via prompt inline
bind -T session-key-table R \
  command-prompt -p "Rename session:" "rename-session '%%'"

# Presets: abrem layouts pré-configurados de janelas/painéis em background
# Edite ~/.config/tmux/bin/presets.sh para customizar seus ambientes
bind -T session-key-table a run-shell -b "$HOME/.config/tmux/bin/presets.sh dev"
bind -T session-key-table b run-shell -b "$HOME/.config/tmux/bin/presets.sh ops"
bind -T session-key-table A run-shell -b "$HOME/.config/tmux/bin/presets.sh ai"
bind -T session-key-table e run-shell -b "$HOME/.config/tmux/bin/presets.sh explore"

# Popup persistente centralizado sobre ~/work/ (toggle: abre/fecha)
bind -T session-key-table Enter \
  run-shell -b "$HOME/.config/tmux/bin/popup-toggle.sh"


# ─────────────────────────────────────────────────────────────────────────────
#  SEÇÃO 6 — MODO TOOLS  (C-g)
#  ─────────────────────────────────────────────────────────────────────────────
#  Pressione C-g para entrar no modo TOOLS-KEY-TABLE.
#  Uma mensagem "TOOLS" aparece na barra de status.
#  Em seguida, pressione uma das teclas abaixo:
#
#   g  →  LazyGit   (TUI para Git)
#   d  →  LazyDocker (TUI para Docker)
#   n  →  Neovim    (editor no diretório atual)
#   f  →  Yazi      (gerenciador de arquivos TUI)
#   ?  →  Help      (exibe docs/help.md via glow)
#   C-g →  fallback — envia C-g ao programa ativo
#
#  Cada ferramenta abre em uma janela dedicada e reutilizável
#  (gerenciado por bin/tool-window.sh).
# ─────────────────────────────────────────────────────────────────────────────

# Entra no modo tools e exibe label na status bar
bind -n C-g display-message "TOOLS" \; switch-client -T tools-key-table

# Fallback: se pressionar C-g novamente, envia o sinal para o programa ativo
bind -T tools-key-table C-g send-keys C-g

# Abre/foca janela dedicada de cada ferramenta no diretório do painel atual
bind -T tools-key-table g \
  run-shell "$HOME/.config/tmux/bin/tool-window.sh LazyGit    lazygit    \"#{pane_current_path}\""
bind -T tools-key-table d \
  run-shell "$HOME/.config/tmux/bin/tool-window.sh LazyDocker lazydocker \"#{pane_current_path}\""
bind -T tools-key-table n \
  run-shell "$HOME/.config/tmux/bin/tool-window.sh Nvim       nvim       \"#{pane_current_path}\""
bind -T tools-key-table f \
  run-shell "$HOME/.config/tmux/bin/tool-window.sh Yazi       yazi       \"#{pane_current_path}\""

# Exibe o arquivo de ajuda formatado via glow em um popup grande
bind -T tools-key-table ? \
  display-popup -E -w 90% -h 90% "glow --pager $HOME/.config/tmux/docs/help.md"


# ─────────────────────────────────────────────────────────────────────────────
#  SEÇÃO 7 — TEMA: TOKYONIGHT NIGHT
#  ─────────────────────────────────────────────────────────────────────────────
#  Paleta inspirada em: https://github.com/folke/tokyonight.nvim
#
#  As cores são armazenadas em variáveis do tmux (@blue, @green…) para
#  facilitar manutenção e criar um tema "Day" alternativo no futuro.
#
#  Para alternar entre temas claro/escuro: <prefix> + b
# ─────────────────────────────────────────────────────────────────────────────

# Títulos da janela do terminal host (iTerm2, WezTerm, etc.)
set -g set-titles on
set -g set-titles-string "#I:#W#{?window_flags,#{window_flags}, } - #S:#I.#P"

# Toggle de tema (claro ↔ escuro)
bind b run-shell "$HOME/.config/tmux/bin/theme-toggle.sh"

# ── Paleta TokyoNight "Night" ──────────────────────────────────────────────
# @blue   = fundo escuro da UI
# @blue2  = elementos de baixo contraste (separadores, textos secundários)
# @blue3  = azul destaque (janela ativa, bordas ativas)
# @green  = confirmações, nomes de sessão
# @purple = hostname
# @red    = alertas, hora, bordas de menus/popups
# @yellow = alertas de atividade
set -g @blue   "#24283b"
set -g @blue2  "#525c7d"
set -g @blue3  "#7aa2f7"
set -g @green  "#9ece6a"
set -g @purple "#9d7cd8"
set -g @red    "#f7768e"
set -g @yellow "#e0af68"

# ── Barra de status ────────────────────────────────────────────────────────

set -g status on
set -g status-position top          # status no topo (estilo Neovim/IDE)
set -g status-style "fg=default bg=default"

set -g status-left ''
set -g status-left-length 0
set -g status-right-length 70

# Lado direito da status bar (da esquerda para a direita):
#  ⚑  →  alerta de atividade em alguma janela
#  indicador de modo  (TMUX / WAIT / COPY / SYNC)
#  comando atual @ nome da sessão @ hostname
#  │  data abreviada
#  │  hora em negrito vermelho
set -g status-right \
  '#[fg=#{@blue2}]#{?#{session_alerts}, #[fg=#{@yellow}]⚑,}'\
'#[fg=#{@green},bold]#{tmux_mode_indicator}'\
'#[fg=#{@blue2}] #{pane_current_command}@'\
'#[fg=#{@green},bold]#{=20:session_name}'\
'#[fg=#{@blue2}]@#[fg=#{@purple}]#h'\
'#[fg=#{@blue2}]│#[fg=#{@blue3}]%a %d %b'\
'#[fg=#{@blue2}]│#[fg=#{@red},bold]%H:%M'

# ── Mensagens de status (linha de comando do tmux) ─────────────────────────
set -g message-style "fg=#{@blue} bg=#{@blue3}"

# ── Menus (prefix + >) ────────────────────────────────────────────────────
set -g menu-border-style    "fg=#{@red}   bg=default"
set -g menu-style           "fg=#{@blue3} bg=default"
set -g menu-selected-style  "fg=#{@blue}  bg=#{@red}"

# ── Popups ────────────────────────────────────────────────────────────────
set -g popup-border-style   "fg=#{@red}   bg=default"

# ── Modo de cópia ─────────────────────────────────────────────────────────
set -g mode-style                    "fg=#{@blue}  bg=#{@blue2}"
set -g copy-mode-match-style         "fg=#{@blue}  bg=#{@blue2}"
set -g copy-mode-current-match-style "fg=#{@blue}  bg=#{@red}"
set -g copy-mode-mark-style          "fg=#{@green} bg=#{@purple}"

# ── Janelas na status bar ─────────────────────────────────────────────────
setw -g window-status-separator      ""

# Janela ativa: fundo azul-claro, ícone de zoom (󰊓) e atividade (▲) se houver
setw -g window-status-current-format \
  "#[fg=#{@blue},bg=#{@blue3}] #I.#W#{?window_zoomed_flag, 󰊓,}#{?window_activity_flag, ▲,} "

# Janelas inativas: sem fundo, texto em @blue2
setw -g window-status-format \
  "#[fg=#{@blue2},bg=default] #I.#W#{?window_activity_flag, ▲,} "

# ── Painéis ───────────────────────────────────────────────────────────────
# Indicadores de direção com setas nas bordas dos painéis
set -g pane-border-indicators    arrows
set -g pane-border-style         "bg=default fg=#{@blue2}"
set -g pane-active-border-style  "bg=default fg=#{@blue3}"


# ─────────────────────────────────────────────────────────────────────────────
#  SEÇÃO 8 — PLUGINS (TPM — Tmux Plugin Manager)
#  ─────────────────────────────────────────────────────────────────────────────
#  Após editar esta lista, instale/atualize com:
#    <prefix> + I   →  instala novos plugins
#    <prefix> + U   →  atualiza todos os plugins
#    <prefix> + M-u →  remove plugins não listados aqui
# ─────────────────────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'             # Gerenciador de plugins (obrigatório)
set -g @plugin 'tmux-plugins/tmux-sensible'   # Defaults sensatos para o tmux
set -g @plugin 'tmux-plugins/tmux-prefix-highlight' # Destaca quando o prefix está ativo
set -g @plugin 'MunifTanjim/tmux-mode-indicator'    # Indicador de modo na status bar
set -g @plugin 'rickstaa/tmux-notify'               # Notifica quando um comando termina

# ── tmux-notify ──────────────────────────────────────────────────────────
# Notifica (via macOS/Linux notification) quando um comando leva mais de N segundos
set -g @tnotify-verbose          'on'
set -g @tnotify-verbose-msg      'Finished #S:: #T'   # Mensagem: sessão::título
set -g @tnotify-sleep-duration   '5'                  # Aguarda 5s antes de monitorar

# ── tmux-mode-indicator ───────────────────────────────────────────────────
# Labels exibidos na status bar conforme o estado atual do tmux
set -g @mode_indicator_prefix_prompt 'WAIT'   # Prefix pressionado, aguardando tecla
set -g @mode_indicator_copy_prompt   'COPY'   # Modo de cópia ativo
set -g @mode_indicator_sync_prompt   'SYNC'   # Painéis sincronizados (broadcast)
set -g @mode_indicator_empty_prompt  'TMUX'   # Estado normal

# Todos os modos com o mesmo fundo (@blue2) — discreto, sem poluir o status
set -g @mode_indicator_prefix_mode_style 'bg=#{@blue2},fg=default'
set -g @mode_indicator_copy_mode_style   'bg=#{@blue2},fg=default'
set -g @mode_indicator_sync_mode_style   'bg=#{@blue2},fg=default'
set -g @mode_indicator_empty_mode_style  'bg=#{@blue2},fg=default'


# ─────────────────────────────────────────────────────────────────────────────
#  BOOTSTRAP DO TPM
#  Clona o TPM automaticamente se ainda não estiver instalado.
#  Mantém o repositório portátil — basta copiar o tmux.conf e abrir o tmux.
# ─────────────────────────────────────────────────────────────────────────────

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm \
        && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Deve ser a ÚLTIMA linha do arquivo
run -b '~/.tmux/plugins/tpm/tpm'
